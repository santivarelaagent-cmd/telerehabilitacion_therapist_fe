<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" />
  <!-- Arco de ángulo articular (biomecánica) -->
  <path d="M 18 44 L 32 22 L 48 36" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arco de medición de ángulo -->
  <path d="M 26 32 A 10 10 0 0 1 39 29" fill="none" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" />
  <!-- Nodos articulares (3 puntos trackeados) -->
  <circle cx="18" cy="44" r="4.5" fill="#ffffff" />
  <circle cx="32" cy="22" r="5.5" fill="url(#accent)" stroke="#ffffff" stroke-width="2" />
  <circle cx="48" cy="36" r="4.5" fill="#ffffff" />
</svg>
